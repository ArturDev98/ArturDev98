<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 170" width="380" height="170" role="img">
<title>2× faster: the platform's slowest process</title>
<style>
@font-face{font-family:'Oxanium';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Red Hat Text';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Red Hat Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
.num{font-family:'Oxanium',sans-serif;font-weight:700;font-size:60px;fill:#0A6B75}
.etq{font-family:'Red Hat Text',sans-serif;font-weight:500;font-size:16px;fill:#33485A}
.min{font-family:'Red Hat Mono',monospace;font-weight:500;font-size:13px}
.barra{transform-box:fill-box;transform-origin:left center;transform:scaleX(0.449);animation:encoge 9s ease-in-out infinite}
.viejo{opacity:0;animation:envejece 9s ease-in-out infinite}
@keyframes encoge{0%,20%{transform:scaleX(1);opacity:1}45%{transform:scaleX(0.449);opacity:1}92%{transform:scaleX(0.449);opacity:1}96%{transform:scaleX(0.449);opacity:0}96.01%{transform:scaleX(1);opacity:0}100%{transform:scaleX(1);opacity:1}}
@keyframes envejece{0%,20%{opacity:1}45%,96%{opacity:0}96.01%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect x="0.5" y="0.5" width="379" height="169" rx="16" fill="#F6F9FB" stroke="#C5D3DB"/>
<text x="28" y="68" class="num">2×</text>
<text x="28" y="100" class="etq">faster: the platform's slowest process</text>
<rect x="28" y="128" width="324" height="8" rx="4" fill="#E6EEF2" stroke="#C5D3DB"/>
<g class="barra"><rect x="28" y="128" width="324" height="8" rx="4" fill="#1D7342"/><rect class="viejo" x="28" y="128" width="324" height="8" rx="4" fill="#8A5600"/></g>
<text x="28" y="158" class="min" fill="#1D7342">2.2 min</text>
<text x="352" y="158" class="min" text-anchor="end" fill="#8A5600">4.9 min</text>
</svg>
